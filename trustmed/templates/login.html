<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustMed — sign in</title>
<style>
:root{--paper:#f4f6f6;--card:#fff;--ink:#16212a;--muted:#5b6b76;--line:#d9e0e3;--teal:#0e6f73;
      --bad-soft:#fbe4e4;--bad:#8a1f1f;--film:#0e1419;
      --font:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:15px/1.5 var(--font)}
header{position:fixed;top:0;left:0;right:0;padding:14px 28px;background:var(--film);color:#fff}
header h1{margin:0;font:600 20px var(--font)}
header span{color:#c9d3d9;font-size:13px;margin-left:10px}
form{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px;width:340px;margin-top:60px}
h2{margin:0 0 16px;font:600 17px var(--font)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input{width:100%;padding:9px;border:1px solid var(--line);border-radius:5px;font:inherit}
button{margin-top:18px;width:100%;padding:10px;border:0;border-radius:5px;background:var(--teal);color:#fff;font:600 15px var(--font);cursor:pointer}
.err{margin-top:12px;padding:8px 10px;border-radius:5px;background:var(--bad-soft);color:var(--bad);font-size:13.5px}
.hint{margin-top:14px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header><h1>TrustMed</h1><span>research prototype</span></header>
<form method="post" action="/auth/login">
  <h2>Sign in</h2>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <p class="hint">Accounts are created by the administrator. This prototype stores no patient data.</p>
</form>
</body>
</html>
